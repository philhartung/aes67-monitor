appId: "com.phlhar.stream-monitor"
productName: "Stream Monitor"
artifactName: "${name}-${version}-${os}-${arch}.${ext}"
directories:
  output: release-builds

# OS specific settings
mac:
  icon: "icon/icon.ico"
  target:
    - dmg
    - zip

win:
  icon: "icon/icon.png"
  target:
    - msi
    - zip

linux:
  icon: "icon/icon.png"
  target:
    - deb
    - rpm
    - zip

# Target specific settings
msi:
  oneClick: false
